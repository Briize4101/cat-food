<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member</title>

    <style>
        body {
            display: none !important;
        }

        .member-profile {
            max-width: 560px;
            margin: 32px auto 80px;
            padding: 0 20px;
        }

        .member-profile .subtitle {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
        }

        .member-profile .profile-row {
            margin-bottom: 16px;
        }

        .member-profile label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .member-profile input,
        .member-profile textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            padding: 12px 14px;
        }

        .member-profile textarea {
            min-height: 96px;
            resize: vertical;
        }

        .member-profile input[readonly] {
            background: #f6f6f6;
            color: #666;
        }

        .member-profile .profile-actions {
            align-items: center;
            display: flex;
            gap: 16px;
            margin-top: 24px;
        }

        .member-profile .profile-status {
            color: #555;
            font-size: 14px;
        }

        .admin-actions {
            display: none;
            gap: 12px;
            justify-content: center;
            margin: 0 auto 42px;
            max-width: 560px;
            padding: 0 20px;
        }

        .admin-actions.is-visible {
            display: flex;
        }

        .admin-actions .btn {
            width: auto;
            text-decoration: none;
        }


        .order-history {
            max-width: 880px;
            margin: 0 auto 90px;
            padding: 0 20px;
        }

        .order-history .subtitle {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: center;
        }

        .order-history-status {
            min-height: 24px;
            color: #555;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: center;
        }

        .order-history-list {
            display: grid;
            gap: 14px;
        }

        .order-history-card {
            border: 1px solid #ddd;
            padding: 16px;
            background: #fff;
        }

        .order-history-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .order-history-items {
            display: grid;
            gap: 6px;
            color: #555;
            font-size: 14px;
        }

        .order-history-empty {
            color: #555;
            font-size: 14px;
            text-align: center;
        }
    </style>

    <script src="JS/auth.js?v=20260721"></script>
    <script src="JS/cart.js?v=20260822-order-history"></script>
    <script>
        function showBody() {
            if (document.body) {
                document.body.style.setProperty("display", "block", "important");
            }
        }

        checkLoginStatus().then(loggedIn => {
            if (!loggedIn) {
                document.documentElement.style.display = "block";
                window.location.replace("log_in.html");
            } else {
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", showBody);
                } else {
                    showBody();
                }
            }
        });
    </script>

    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./vendor/bootstrap-grid.css">
    <link rel="stylesheet" href="./vendor/fontawesome-free-7.0.0-web/css/all.css">
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <div class="navbar" style="padding: 40px;">
                <a href="project.html" class="brand">
                    <img src="https://uniam.jp/cdn/shop/files/header-uniam_logo.png?v=1693479467&width=200"
                    alt="uniam" width="100" height="25.0" loading="eager" class="header__heading-logo" sizes="(min-width: 750px) 100px, 50vw">
                </a>
                <a href="#" class="logout" style="display: block; color: #000; text-decoration: none; position:absolute; right:40px; font-weight:600;">Logout</a>
            </div>
        </header>
        <div class="space"></div>

        <div class="login">
            <div class="container" style="padding-top: 0;">
                <div class="title" style="font-size: 36px;">MY PAGE</div>
            </div>
        </div>

        <section class="member-profile">
            <div class="subtitle">Member Profile</div>
            <form id="profileForm">
                <div class="profile-row">
                    <label for="profileEmail">Email</label>
                    <input type="email" id="profileEmail" readonly>
                </div>
                <div class="profile-row">
                    <label for="profileName">Name</label>
                    <input type="text" id="profileName" name="name" autocomplete="name">
                </div>
                <div class="profile-row">
                    <label for="profilePhone">Phone</label>
                    <input type="tel" id="profilePhone" name="phone" autocomplete="tel">
                </div>
                <div class="profile-row">
                    <label for="profileAddress">Address</label>
                    <textarea id="profileAddress" name="address" autocomplete="street-address"></textarea>
                </div>
                <div class="profile-actions">
                    <button type="submit" id="profileSaveBtn" class="btn">Save</button>
                    <span id="profileStatus" class="profile-status"></span>
                </div>
            </form>
        </section>

        <section id="adminActions" class="admin-actions">
            <a href="/admin/products" class="btn">Product Admin</a>
            <a href="/admin/orders" class="btn">Order Admin</a>
        </section>

        <section class="order-history">
            <div class="subtitle">Paid Order History</div>
            <p id="orderHistoryStatus" class="order-history-status">Loading orders...</p>
            <p id="orderHistoryEmpty" class="order-history-empty" hidden>No paid orders yet.</p>
            <div id="orderHistoryList" class="order-history-list"></div>
        </section>
    </div>
</body>

<script>
const logoutBtn = document.querySelector(".logout");

if (logoutBtn) {
    logoutBtn.addEventListener("click", (e) => {
        e.preventDefault();
        logout();
    });
}

initMemberProfileForm();
if (typeof initMemberOrderHistory === 'function') {
    initMemberOrderHistory();
}

async function initAdminActions() {
    const adminActions = document.getElementById("adminActions");
    const token = localStorage.getItem("userToken");
    if (!adminActions || !token) return;

    try {
        const response = await fetch("/api/check-auth", {
            cache: "no-store",
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await response.json();
        if (response.ok && data.loggedIn && data.role === "admin") {
            adminActions.classList.add("is-visible");
        }
    } catch (error) {
        console.error("Admin role check failed:", error);
    }
}

initAdminActions();
</script>
</html>
