<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Admin</title>
    <style>
        :root {
            --bg: #f6f4ef;
            --panel: #ffffff;
            --ink: #252525;
            --muted: #6f6a62;
            --line: #ddd6cc;
            --accent: #2f6f73;
            --accent-dark: #214f52;
            --danger: #9d2f2f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }
        .admin-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 48px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 18px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 30px;
            line-height: 1.2;
            letter-spacing: 0;
        }
        .muted { color: var(--muted); }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button, select {
            min-height: 38px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            padding: 8px 12px;
            font-size: 14px;
        }
        button {
            cursor: pointer;
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 700;
        }
        button:hover { background: var(--accent-dark); }
        button:disabled { opacity: .55; cursor: not-allowed; }
        .status-text {
            min-height: 24px;
            margin: 10px 0 16px;
            color: var(--muted);
        }
        .table-wrap {
            overflow-x: auto;
            background: var(--panel);
            border: 1px solid var(--line);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1260px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
            font-size: 14px;
        }
        th {
            background: #eee8df;
            font-size: 13px;
            text-transform: uppercase;
            color: #4f4942;
        }
        .order-id { font-weight: 800; }
        .items {
            display: grid;
            gap: 6px;
        }
        .item-line {
            display: grid;
            grid-template-columns: minmax(160px, 1fr) auto auto;
            gap: 10px;
            color: var(--muted);
        }
        .payment-result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .payment-result-actions button {
            min-height: 32px;
            padding: 6px 10px;
        }
        .payment-result-actions .secondary {
            background: #8f3d3d;
            border-color: #8f3d3d;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 4px 8px;
            border: 1px solid var(--line);
            background: #faf8f4;
            font-weight: 700;
            white-space: nowrap;
        }
        .error { color: var(--danger); }
        @media (max-width: 720px) {
            .admin-header { align-items: flex-start; flex-direction: column; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <main class="admin-shell">
        <header class="admin-header">
            <div>
                <h1>Order Admin</h1>
                <div class="muted">Manage order status from the backend server.</div>
            </div>
            <div class="toolbar">
                <select id="statusFilter" aria-label="Filter by status">
                    <option value="">All statuses</option>
                </select>
                <button type="button" id="refreshBtn">Refresh</button>
            </div>
        </header>

        <div id="adminStatus" class="status-text">Loading orders...</div>

        <section class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Member</th>
                        <th>Recipient</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Submitted</th>
                        <th>Current Status</th>
                        <th>Payment Result</th>
                        <th>Change Status</th>
                        <th>Updated</th>
                    </tr>
                </thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </section>
    </main>

    <script src="/JS/order_admin.js?v=20260811-payment-result"></script>
</body>
</html>
